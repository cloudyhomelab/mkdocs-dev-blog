name: publish blog image

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # the base image is tracked by a moving tag, so rebuild weekly to pick up its updates
    - cron: '23 4 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    name: build and publish the image
    runs-on: ubuntu-latest
    needs: [validate]

    permissions:
      contents: read
      id-token: write

    env:
      REGISTRY: docker.io

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: take the build timestamp
        id: stamp
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          BUILD_TIMESTAMP: ${{ steps.stamp.outputs.value }}
          GIT_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        with:
          targets: default
          push: true
          set: |
            *.attest=type=provenance,mode=max
            *.attest=type=sbom

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign published image(s) (keyless)
        run: |
          set -euo pipefail

          cat > bake-metadata.json <<'JSON'
          ${{ steps.bake.outputs.metadata }}
          JSON

          # Extract tag@digest refs from Bake metadata and sign them.
          jq -r '
            to_entries[]
            | .value as $v
            | ($v["containerimage.digest"] // empty) as $digest
            | ($v["image.name"] // empty) as $names
            | if ($digest == "" or $names == "") then empty else
                (if ($names|type) == "string" then ($names|split(",")) else $names end)
                | map(gsub("^\\s+|\\s+$"; ""))
                | map(select(length>0))
                | .[]
                | "\(. )@\($digest)"
              end
          ' bake-metadata.json | sort -u | while read -r ref; do
            echo "Signing ${ref}"
            cosign sign --yes "${ref}"
          done

  roll-out:
    name: pull the new image on the vps
    runs-on: ubuntu-latest
    needs: [publish]

    permissions: {}

    steps:
      # GITHUB_TOKEN is scoped to this repository, so dispatching a workflow in
      # vps_control needs the cloudyhome bot App, installed there with Actions write
      - name: mint a token for the vps repository
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLOUDYHOME_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLOUDYHOME_BOT_PRIVATE_KEY }}
          owner: cloudyhomelab
          repositories: vps_control
          permission-actions: write

      - name: run the podman auto-update workflow
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh workflow run podman-auto-update.yml --repo cloudyhomelab/vps_control --ref main
