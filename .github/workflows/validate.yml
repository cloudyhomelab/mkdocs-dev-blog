name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  # publish.yml runs this before it pushes the image
  workflow_call:

# when called from publish.yml, github.workflow is the caller's name, so the
# suffix keeps this group apart from the caller's own
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-validate
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint the build files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: run the BuildKit Dockerfile checks
        run: docker buildx bake --check

  build:
    name: build the image and smoke-test it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # the Dockerfile runs `mkdocs build --strict`, so a broken post fails this step
      - name: build the amd64 image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: default
          load: true
          push: false
          set: |
            *.platform=linux/amd64
            *.tags=blog:validate

      - name: smoke-test the image
        run: |
          set -euo pipefail
          image=blog:validate

          cid=$(docker run --detach --rm -p 8000:8000 "$image")
          trap 'docker logs "$cid"; docker stop "$cid" >/dev/null' EXIT
          for _ in $(seq 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" = healthy ] || { echo "container never became healthy"; exit 1; }

          expect() { # path expected-status
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8000$1")
            [ "$status" = "$2" ] || { echo "$1: expected $2, got $status"; exit 1; }
          }
          expect / 200
          expect /search/search_index.json 200
          expect /css/theme.css 200
          expect /no-such-page 404
          curl --silent http://127.0.0.1:8000/no-such-page | grep -q '<title>Not found' || { echo "404 page not served"; exit 1; }

  # the single required status check for branch protection
  validated:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: always()

    permissions: {}

    steps:
      - name: fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done
